<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nokia Snake</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#111;font-family:Arial,sans-serif;
    color:#071b08;touch-action:none;
  }
  .phone{
    width:min(94vw,430px);padding:24px 20px 28px;
    background:linear-gradient(145deg,#9aa39a,#667066);
    border:5px solid #4b514b;border-radius:30px;
    box-shadow:inset 0 0 0 3px #b8beb8,0 18px 50px #000;
  }
  .brand{text-align:center;font-weight:900;font-size:28px;letter-spacing:5px;color:#ddd;text-shadow:1px 2px #333;margin-bottom:16px}
  .screen{
    background:#9bbc0f;
    border:12px solid #303630;border-radius:8px;
    box-shadow:inset 0 0 25px rgba(0,0,0,.18);
    padding:10px;
  }
  .hud{display:flex;justify-content:space-between;font:bold 15px monospace;margin-bottom:7px}
  canvas{display:block;width:100%;aspect-ratio:1;background:#9bbc0f;image-rendering:pixelated}
  .message{text-align:center;font:bold 15px monospace;min-height:20px;margin-top:6px}
  .controls{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:250px;margin-left:auto;margin-right:auto}
  button{
    border:0;background:#313631;color:#d9ddd9;font-weight:900;
    min-height:54px;border-radius:12px;box-shadow:0 4px #171a17;
    font-size:20px;-webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px #171a17}
  .empty{visibility:hidden}
  .start{display:block;width:100%;margin-top:18px;font-size:15px}
  .hint{text-align:center;color:#e5e8e5;font-size:11px;margin-top:15px;line-height:1.5}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">NOKIA</div>
  <div class="screen">
    <div class="hud"><span>SNAKE</span><span>SCORE: <span id="score">0</span></span></div>
    <canvas id="game" width="300" height="300"></canvas>
    <div class="message" id="message">PRESS START</div>
  </div>
  <button class="start" id="start">START / RESTART</button>
  <div class="controls">
    <button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <div class="hint">Arrow keys / WASD • Tap buttons on mobile</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),msg=document.getElementById("message");
const N=20, cell=15;
let snake, food, dir, nextDir, score, running=false, timer;

function grid(x,y){return {x:x*cell,y:y*cell}}
function draw(){
  ctx.fillStyle="#9bbc0f";ctx.fillRect(0,0,300,300);
  // subtle LCD pixel grid
  ctx.fillStyle="rgba(7,27,8,.035)";
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)ctx.fillRect(x*cell,y*cell,1,1);

  ctx.fillStyle="#071b08";
  snake.forEach((p,i)=>{
    const r=grid(p.x,p.y);
    ctx.fillRect(r.x+1,r.y+1,cell-2,cell-2);
    if(i===0){
      ctx.fillStyle="#9bbc0f";
      ctx.fillRect(r.x+4,r.y+4,2,2);
      ctx.fillRect(r.x+9,r.y+4,2,2);
      ctx.fillStyle="#071b08";
    }
  });
  const f=grid(food.x,food.y);
  ctx.fillRect(f.x+3,f.y+3,cell-6,cell-6);
  ctx.fillRect(f.x+6,f.y+1,3,3);
}
function placeFood(){
  do food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}
  while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function start(){
  clearInterval(timer);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent=0;
  placeFood();running=true;msg.textContent="GO!";
  draw();timer=setInterval(tick,120);
}
function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||
     snake.some(p=>p.x===head.x&&p.y===head.y)){
    running=false;clearInterval(timer);msg.textContent="GAME OVER — PRESS START";draw();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;scoreEl.textContent=score;placeFood();
  }else snake.pop();
  draw();
}
function setDir(d){
  if(!running)return;
  const opposite=dir.x===-d.x&&dir.y===-d.y;
  if(!opposite)nextDir=d;
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowup"||k==="w"){e.preventDefault();setDir({x:0,y:-1})}
  if(k==="arrowdown"||k==="s"){e.preventDefault();setDir({x:0,y:1})}
  if(k==="arrowleft"||k==="a"){e.preventDefault();setDir({x:-1,y:0})}
  if(k==="arrowright"||k==="d"){e.preventDefault();setDir({x:1,y:0})}
  if(k==="enter"||k===" "){if(!running)start()}
});
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("pointerdown",()=>{
  const d=b.dataset.dir;
  setDir(d==="up"?{x:0,y:-1}:d==="down"?{x:0,y:1}:d==="left"?{x:-1,y:0}:{x:1,y:0});
}));
document.getElementById("start").addEventListener("click",start);
draw();
</script>
</body>
</html>
